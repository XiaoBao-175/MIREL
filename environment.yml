name: mirel-pg-opd

channels:
  - conda-forge
  - nodefaults

dependencies:
  # The released experiments were run with Python 3.12 and CUDA 12.8 wheels.
  - python=3.12.14
  - pip=26.2.1
  - git
  - git-lfs
  - cmake
  - ninja
  - pkg-config
  - ffmpeg
  - pip:
      # Keep the CUDA-enabled PyTorch family aligned with the H100 setup.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.10.0+cu128
      - torchvision==0.25.0+cu128
      - torchaudio==2.10.0+cu128

      # Core model, distributed-training, and inference stack.
      - transformers==5.5.0
      - tokenizers==0.22.2
      - safetensors==0.7.0
      - accelerate==1.12.0
      - peft==0.18.0
      - flash-attn==2.8.3.post1
      - vllm==0.18.0
      - ray[default]==2.53.0
      - tensordict==0.10.0
      - liger-kernel==0.7.0

      # Data, vision, evaluation, and experiment tracking.
      - datasets==4.4.2
      - numpy==1.26.4
      - pandas==2.3.3
      - pyarrow==22.0.0
      - pillow==12.0.0
      - qwen-vl-utils==0.0.14
      - opencv-python-headless==4.13.0.92
      - scikit-learn==1.9.0
      - scipy==1.17.1
      - matplotlib==3.10.8
      - openai==2.24.0
      - wandb==0.23.1

      # Shared utilities used by the released scripts.
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - einops==0.8.2
      - sentencepiece==0.2.1
      - pyzmq==27.1.0
      - pyyaml==6.0.3
      - requests==2.32.5
      - tqdm==4.67.3
      - rich==14.3.3
      - psutil==7.1.3
      - python-dotenv==1.2.1
      - huggingface_hub==1.9.0
